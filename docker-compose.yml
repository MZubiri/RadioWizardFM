version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wizardfm-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - AZURACAST_API_URL=${AZURACAST_API_URL:-https://panel.wizardfm.lat}
      - STREAM_URL=${STREAM_URL:-https://panel.wizardfm.lat/listen/wizardfm/radio.mp3}
    restart: unless-stopped
    depends_on:
      - chat
    networks:
      default:
      coolify:
        aliases:
          - wizardfm-frontend

  chat:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wizardfm-chat
    ports:
      - "${CHAT_PORT:-3001}:3001"
    environment:
      - WS_PORT=3001
      - MAX_HISTORY=${MAX_HISTORY:-100}
      - RATE_LIMIT_MS=${RATE_LIMIT_MS:-1000}
      - MAX_MESSAGE_LENGTH=${MAX_MESSAGE_LENGTH:-500}
    volumes:
      - chat_data:/app/data
    restart: unless-stopped
    networks:
      default:
      coolify:
        aliases:
          - wizardfm-chat

networks:
  default:
  coolify:
    name: coolify
    external: true

volumes:
  chat_data:
